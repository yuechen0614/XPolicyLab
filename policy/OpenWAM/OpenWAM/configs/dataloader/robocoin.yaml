type: robocoin

# ── Dataset root ────────────────────────────────────────────────────────────
# Root directory containing the RoboCOIN datasets (LeRobot v3 format): 677
# datasets across 15 robot types (symlinks to the raw lerobotv3 snapshot, plus
# meta/stats_<robot_type>.json). Each subdirectory has meta/info.json, data/,
# videos/. The reader auto-discovers all sub-datasets and wraps them in a
# MultiRobotCOINDataset with binary-search dispatch.
#
# This is the QC-cleaned copy. Relative to the raw 702-dataset snapshot it drops
# 411 episodes (broken eef_sim_pose_state, or >70% dead frames), 22 datasets that
# were 50 fps instead of 30, and 2 datasets whose head-camera viewpoint was
# rejected on review. See teleop_qc/_robocoin/REMOVED.md for the full ledger and
# how to restore any of it -- nothing was rm'd.
#
# NOTE: meta/stats_<robot_type>.json lives at the ROOT meta/, not inside each
# bucket. Copying only the bucket directories loses per-robot normalization.
#
# Whole-bucket quality denylist (enforced before reader AND stats discovery):
#   Airbot_MMK2_storage_peach_pear
# Its hand joints are degree-like while metadata declares radians. The source
# directory is removed from this clean root, and the denylist also prevents an
# accidentally restored copy from entering training, hour allocation,
# normalization stats, or stats contributor provenance. The canonical contract
# lives in robocoin.py::ROBOCOIN_WHOLE_BUCKET_EXCLUSIONS.
dataset_dir: /mnt/data/wangyuran/pretrain_dataset/RoboCOIN_clean

# ── Pose-frame contract ────────────────────────────────────────────────────
# eef_sim_pose_* is expressed in RoboCOIN's unified base axes, but that alone
# does not make every endpoint a common task TCP. FK audits identify the public
# families as terminal arm-side links (Piper link6, G1 wrist_yaw/arm_end,
# Realman link7); none includes a known downstream gripper-center offset. Other
# families remain exact-link-unproven because the FK generator/models are not
# public, although their pose is rigid in arm joints and independent of fingers.
# Keep these published poses under the rigid-terminal-arm / gripper-independent
# contract; do not add a blanket TCP offset or label every robot as one literal
# flange or TCP.

# ── Window / stride ─────────────────────────────────────────────────────────
# num_frames + video_stride match EgoDex / RoboTwin so mixture batches
# collate without per-source resize.
# 33 frames, stride 4 → 9 video frames per sample.
# Constraint: (num_frames - 1) % video_stride == 0
#             (num_video_frames - 1) % 4 == 0  (Wan VAE temporal axis)
num_frames: 33
video_stride: 4
window_stride: 1

# ── Leading / trailing dead-frame trim ──────────────────────────────────────
# Skip the motionless run at the start / end of an episode -- the operator had
# started recording before touching the controls, or kept recording after the
# task finished. Those frames teach the model to predict "no motion".
#
# 122,701 episodes carry a trim, removing 6,767,240 frames (62.66 h, 6.7% of the
# corpus). Nothing on disk changes: the trim is expressed purely as an
# offset+length shift (see robocoin.py::_filter_episodes), so every window the
# sampler produces already lies inside the kept span -- verified end-to-end by
# decoding 3,054,709 real samples covering all 136,916 episodes.
#
# ★ Keys on the episode_index AFTER any physical deletion. Deleting episodes
#   renumbers the survivors, so a list built before a deletion will trim
#   whichever episode inherited the index. Re-run teleop_qc/_robocoin/
#   remap_trim_after_delete.py after every deletion; the reader cross-checks
#   total_frames against the manifest length and aborts dataset construction if
#   the list is stale.
# ★ null disables trimming -- which silently loads the uncleaned data.
trim_csv: /mnt/data/wangyuran/teleop_qc/_robocoin/out/filter/trim_v6_remapped.csv

# ── Image size ──────────────────────────────────────────────────────────────
# multiview=true → L-shape canvas: top 256H×320W (head cam) +
#   bottom-left 128H×160W (left wrist) + bottom-right 128H×160W (right wrist).
#   height MUST be 384 and width MUST be 320.
# multiview=false → single head camera at (height, width), set to 256×320.
height: 384
width: 320

# ── Multiview ───────────────────────────────────────────────────────────────
# Head camera is auto-resolved per dataset by priority (see HEAD_CAMERA_PRIORITY
# in robocoin.py): cam_high_rgb > cam_head_rgb > ... > cam_chest_rgb, then the
# dex-hand/humanoid families camera_head_rgb (leju) > cam_left_high (G1 Dex3) >
# ego_view (G1edu), appended last so they never preempt the standard keys.
# Wrist cameras: cam_left/right_wrist_rgb (+ _rgb_rgb typo + camera_*_wrist_rgb
# / cam_*_wrist variants). Missing wrist cameras → black region in canvas.
multiview: true

# ── Train / val split ───────────────────────────────────────────────────────
# Honors info.json["splits"][split] when the bucket's info.json declares
# explicit train/val partitions. Otherwise split=train returns the entire
# eps_df. val is not used in pretraining (RoboCOIN is pretraining-only).
split: train
# seed comes from project.seed in train.yaml (injected at launch); the
# Python ctor falls back to 42 if neither is supplied.

# ── Video augmentation (optional) ─────────────────────────────────────────────
# color_jitter: load-time color jitter applied by the reader to each clip, with
# the SAME random factors across all frames (temporal consistency), TRAIN split
# only. Omit / null / false → disabled (default; video byte-identical). Provide
# a dict to enable + set per-channel strengths (hue is a no-op in PIL mode).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# ── Action normalization ────────────────────────────────────────────────────
# Loads per-robot-type stats from {dataset_dir}/meta/stats_{robot_type}.json
# Grippered buckets' `gripper_open_scale_*` is canonical before normalization:
# 0 = fully closed, 1 = fully open. Dexterous-hand buckets have joint-angle hand
# slots rather than a scalar gripper slot, so this aperture convention is not
# applied to their individual finger joints.
# (grouped by info.json robot_type, 15 types total). Run
# python -m openwam.dataloader.utils.stats_computation.robocoin_stats_computation
#   --dataset_dir {dataset_dir} --trim_csv {trim_csv} --split train
# to (re)generate. The generator applies the same train split, exclusions, and
# trim spans as this reader; loading fails closed when population provenance
# does not match. rot6d is identity-pinned both when generated and when loaded.
# Default is quantile — empirically the most usable across all robot types
# (min-max collapses outlier-heavy dims, e.g. aloha Lr2 post-norm std 0.04 vs
# 0.33 under quantile; mean per-dim signal is ~1.4–2.5× higher under quantile).
#   null / "none" → no normalization
#   "min-max"     → ((x - min) / (max - min) * 2 - 1)
#   "z-score"     → ((x - mean) / std)
#   "quantile"    → clip((x - q01) / (q99 - q01) * 2 - 1, -1, 1)  [default]
normalize_mode: quantile

# ── Action / proprio supervision toggle ─────────────────────────────────────
# true  → normal action + proprio supervision (default).
# false → action_mask / proprio_mask all-False; values still loaded but the
#         training pipeline skips the loss contribution. Use as a video-only
#         auxiliary source in a mixture.
enable_action_supervision: true

# ── Unified 80-D action space (cross-robot shared head) ──────────────────────
# unify_action=true scatters this reader's raw action/proprio into a shared 80-D
# vector so heterogeneous robots train one action head; the per-dim mask keeps
# unmapped dims out of the loss. unify_action=false (default) is byte-identical
# to the pre-unify reader. 80-D semantic layout:
#   [ 0: 3) left  eef xyz     [ 3: 9) left  eef rot6d   [ 9]    left  gripper
#   [10:34) left  hand (24)   [34:37) right eef xyz     [37:43) right eef rot6d
#   [43]    right gripper     [44:68) right hand (24)   [68:80) reserved (12)
#
# Grippered buckets: raw 20-D EEF → left-arm 0-9 to unified 0-9, right-arm 10-19
# to 34-43 (the map below). Grip lands in slots 9 / 43.
#
# Dexterous-hand buckets (Airbot_MMK2 / Unitree G1 / discover MMK2 / leju, no
# gripper_open_scale): the reader IGNORES the map below and builds a per-bucket
# one — pose → 0-8 / 34-42, and the kL/kR finger joints (from the raw action /
# observation.state) → the hand slots [10:10+kL) / [44:44+kR), front-aligned;
# the gripper slots 9/43 and the unused hand-slot tails stay masked. This needs
# unify_action=true (variable finger counts only collapse to a uniform head in
# the 80-D space). With unify_action=false these buckets fall back to the standard
# 20-D EEF with the grip slots (9/19) zero-filled + masked (18 supervised pose
# dims; fingers dropped). Finger normalization uses the per-robot "hand"
# stats block in stats_<robot_type>.json.
#
# NOTE: turning this on makes RoboCOIN's action_dim 80 — in a mixture every
# other source's head must also be 80 (set their unify_action=true too).
unify_action: true
unify_action_map: ["0-9", "34-43"]

# ── Data budget (optional) ──────────────────────────────────────────────────
# total_hours: cap effective post-exclusion/post-trim footage, measured in hours.
#   - null / unset (default)  → use the full dataset (current behaviour,
#     no subsampling — the budget path is byte-identical to the pre-budget
#     reader, zero performance / behaviour overhead).
#   - positive float (e.g. 300.0) → subsample episodes across all
#     buckets so the total sampleable video duration is ~total_hours. Allocation
#     uses water-filling: each bucket starts with total_hours / n_buckets,
#     undersized buckets keep all their data, remaining budget is
#     redistributed equally among the rest.
# Subsampling is seeded by project.seed (reproducible across runs). When
# the target exceeds the dataset's actual hours, the full dataset is used
# and a warning is logged.
# The uncapped post-exclusion/post-trim population has 94,228,074 valid raw
# frames (35.759546% of the Agi/RoboCOIN/DROID remainder). Its global
# 14.303818% allocation is 74,100,881 frames = 686.119268518518 h at 30 fps.
total_hours: 686.119268518518
