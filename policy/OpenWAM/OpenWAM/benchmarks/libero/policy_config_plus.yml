# OpenWAM LIBERO-plus benchmark client config.
# This keeps the upstream one-rollout and RNG protocol from commit 4976dc3,
# with the pinned OpenWAM LONG and settling overrides documented below.

policy_name: openwam

host: "127.0.0.1"
port: 8848
request_timeout: 300

flavor: plus

suite: libero_spatial
task_id: 0
num_trials: 1
max_steps: 600
max_steps_by_suite:
  libero_spatial: 600
  libero_object: 600
  libero_goal: 600
  libero_10: 700

# Match libero/configs/config.yaml and libero.lifelong.utils.control_seed.
seed: 10000
rng_mode: official_global
reseed_each_trial: false
fail_on_incomplete: false

# Apply the pinned OpenWAM settling protocol after the fixed init state.
settle_steps: 30
settle_action: [0, 0, 0, 0, 0, 0, -1]

camera_height: 256
camera_width: 256

head_camera_key: agentview_image
left_wrist_camera_key: robot0_eye_in_hand_image
right_wrist_camera_key: null
image_transform: rotate_180

# The plus checkpoint uses the same EEF10 absolute-pose contract as LIBERO.
action_mode: eef
send_state: true
state_keys:
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
state_dim: 10

action_dim: 7
action_indices: null
action_clip: null
osc_pos_scale: null
osc_rot_scale: null

debug: false
debug_dir: "./debug_libero_plus"

save_videos: true
video_dir: "./evaluate_results/libero_plus"
video_fps: 20
video_model_height: 384
video_model_width: 320
